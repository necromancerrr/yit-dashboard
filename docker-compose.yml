services:
  dashboard:
    build:
      context: .
      args:
        # Baked into the client bundle at build time — rebuild to change it.
        NEXT_PUBLIC_DISPLAY_NAME: ${NEXT_PUBLIC_DISPLAY_NAME:-}
    ports:
      - "3000:3000"
    environment:
      # Generate with: openssl rand -base64 32
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      # Prefer APP_PASSWORD_HASH in production — see scripts/hash-password.mjs
      APP_PASSWORD: ${APP_PASSWORD:-}
      APP_PASSWORD_HASH: ${APP_PASSWORD_HASH:-}
      # Decides when "today" rolls over for streaks and the daily checklist.
      TZ: ${TZ:-UTC}
    volumes:
      - dashboard-db:/app/db
    restart: unless-stopped

volumes:
  dashboard-db:
